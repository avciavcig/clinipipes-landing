<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440, height=900">
<title>Patient Form — CliniPipes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/demo/shared.css">
</head>
<body>
<div class="demo-app">
  <div class="topbar">
    <div class="topbar-brand"><h1>CliniPipes</h1></div>
    <div class="topbar-right">
      <span class="topbar-user">Hasta Formu</span>
      <nav><a href="#" class="nav-active">Pre-Assessment</a></nav>
    </div>
  </div>
  <div class="demo-body form-shell">
    <div class="form-card">
      <div class="form-header">
        <h1>CliniPipes Demo Clinic</h1>
        <h2>Patient Pre-Assessment Form</h2>
        <p>Please complete all sections. Fields marked * are required.</p>
      </div>
      <div class="form-body">
        <div class="form-row">
          <div><label class="req">Full Name</label><input value="James Mitchell" readonly></div>
          <div><label class="req">Email</label><input value="james.mitchell@email.com" readonly></div>
        </div>
        <div class="form-row">
          <div><label class="req">Phone</label><input value="+44 7700 900123" readonly></div>
          <div><label class="req">Country</label><select><option>United Kingdom</option></select></div>
        </div>
        <label class="req">Treatment Interest</label>
        <select><option>Hollywood Smile / Veneers</option></select>
        <label>Medical History</label>
        <textarea readonly>No known allergies. Previous dental work in 2022.</textarea>
        <label class="req">Upload Photos</label>
        <div class="upload">📷 Drag & drop or click to upload — PNG, JPG up to 10MB</div>
        <label class="req">X-Ray / Panoramic</label>
        <div class="upload">📎 Upload dental imaging files</div>
        <label class="form-check"><input type="checkbox" checked disabled><span>I consent to the processing of my personal and health data under GDPR/KVKK.</span></label>
        <button type="button" class="form-btn">Submit Assessment</button>
      </div>
    </div>
  </div>
</div>
<script>window.DEMO_PAGE='form';</script>
<script src="/demo/render.js"></script>
</body>
</html>
