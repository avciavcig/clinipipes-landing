<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440, height=900">
<title>Doktor Paneli — CliniPipes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/demo/shared.css">
<style>
.patient-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.patient-name{font-size:20px;font-weight:700;margin:0 0 4px}
.patient-treatment{color:var(--text-secondary);font-size:13px}
.status-badge{display:inline-block;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;background:#DBEAFE;color:#2563EB}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin:0 0 6px}
.grid textarea{width:100%;min-height:88px;padding:10px 12px;border:1px solid #D1D5DB;border-radius:8px;font-family:var(--font);font-size:13px;resize:none}
.photo-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.photo{aspect-ratio:1;background:#F1F5F9;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-muted)}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{background:#2563EB;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600}
.btn2{background:#fff;color:#374151;border:1px solid var(--border);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="demo-app">
  <div class="topbar">
    <div class="topbar-brand"><h1>CliniPipes</h1></div>
    <div class="topbar-right">
      <span class="topbar-user">Dr. Mehmet Yılmaz</span>
      <nav>
        <a href="#" class="nav-active">Doktor Paneli</a>
        <a href="#">Hastalarım</a>
        <a href="#">Çıkış</a>
      </nav>
    </div>
  </div>
  <div class="demo-body">
    <div class="page">
      <div class="card">
        <h2>Hasta Değerlendirmesi</h2>
        <div class="patient-head">
          <div>
            <p class="patient-name">Thomas Weber</p>
            <p class="patient-treatment">Zirconium Crowns · Germany</p>
          </div>
          <span class="status-badge">Plan Hazır</span>
        </div>
        <div class="grid">
          <div>
            <label>Klinik Değerlendirme</label>
            <textarea readonly>Uygun aday. Üst çene 10, alt çene 8 zirkonyum kron önerilir. Periodontal durum stabil.</textarea>
          </div>
          <div>
            <label>Tedavi Planı</label>
            <textarea readonly>2 seanslı tedavi. 1. seans: hazırlık ve geçici protez. 2. seans: final zirkonyum uygulaması.</textarea>
          </div>
        </div>
        <label style="display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin:14px 0 6px">Hasta Görselleri</label>
        <div class="photo-row">
          <div class="photo">Ön gülüş</div>
          <div class="photo">Ağız açık</div>
          <div class="photo">Üst çene</div>
          <div class="photo">Alt çene</div>
        </div>
        <div class="actions">
          <button type="button" class="btn">Planı Onayla</button>
          <button type="button" class="btn2">Ek Görsel İste</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>window.DEMO_PAGE='doctor';</script>
<script src="/demo/render.js"></script>
</body>
</html>
