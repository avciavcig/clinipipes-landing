<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CliniPipes Admin — Giriş</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0E0E0C;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#1a1a18;border:1px solid #2a2a26;border-radius:12px;padding:2rem;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.logo{font-size:1.1rem;font-weight:700;margin-bottom:.25rem;color:#1D9E75}
h1{font-size:1.35rem;margin-bottom:.35rem}
.sub{font-size:.85rem;color:rgba(255,255,255,.45);margin-bottom:1.5rem;line-height:1.5}
label{display:block;font-size:.78rem;color:rgba(255,255,255,.55);margin-bottom:.35rem;font-weight:600}
input{width:100%;padding:.65rem .85rem;border:1px solid #333;border-radius:8px;background:#111;font-size:.95rem;color:#fff;margin-bottom:1rem}
input:focus{outline:none;border-color:#1D9E75}
#totp-wrap{display:none}
button{width:100%;padding:.75rem;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:.92rem;font-weight:600;cursor:pointer}
button:hover{background:#178a66}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:1rem;padding:.65rem .85rem;border-radius:8px;font-size:.82rem;display:none}
.msg.err{display:block;background:#3b1515;color:#fca5a5;border:1px solid #7f1d1d}
.msg.ok{display:block;background:#14332a;color:#86efac;border:1px solid #166534}
.hint{font-size:.75rem;color:rgba(255,255,255,.35);margin-top:1rem;line-height:1.5}
.shield{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:rgba(255,255,255,.4);margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid #2a2a26}
</style>
</head>
<body>
<div class="card">
  <div class="logo">&#9881; CliniPipes</div>
  <h1>Yönetim Paneli</h1>
  <p class="sub">Şifre ve e-posta doğrulama kodu ile giriş yapın.</p>
  <form id="login-form">
    <label for="password">Şifre</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div id="totp-wrap">
      <label for="totp">E-posta Kodu (6 haneli)</label>
      <input type="text" id="totp" name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code">
    </div>
    <button type="submit" id="btn">Giriş Yap</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="shield">&#128274; Oturum çerezi · CSRF koruması · Brute-force engeli</div>
  <p class="hint">2FA açıksa şifre sonrası e-postanıza kod gönderilir.<br><a href="#" id="reset-2fa" style="color:rgba(255,255,255,.45);text-decoration:underline">Eski Authenticator takılı kaldıysa şifre ile sıfırla</a></p>
</div>
<script>
var twoFactorRequired = false;
var pendingToken = '';

fetch('/api/admin/login-info').then(function(r){return r.json();}).then(function(d){
  twoFactorRequired = !!d.twoFactorRequired;
  if(twoFactorRequired) document.getElementById('totp-wrap').style.display='block';
}).catch(function(){});
document.getElementById('reset-2fa').addEventListener('click',function(e){
  e.preventDefault();
  var password=prompt('Admin şifrenizi girin — 2FA sıfırlanacak:');
  if(!password)return;
  fetch('/api/admin/2fa/reset-with-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password})})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,data:d};});})
    .then(function(res){
      alert(res.ok?(res.data.message||'2FA sıfırlandı.'):(res.data.error||'Sıfırlama başarısız'));
      if(res.ok){
        twoFactorRequired=false;
        pendingToken='';
        document.getElementById('totp-wrap').style.display='none';
        document.getElementById('totp').value='';
      }
    })
    .catch(function(){alert('Bağlantı hatası');});
});

document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  var btn=document.getElementById('btn');
  var msg=document.getElementById('msg');
  var password=document.getElementById('password').value;
  var totp=document.getElementById('totp').value.trim();
  btn.disabled=true;
  msg.className='msg';
  msg.textContent='Giriş yapılıyor...';
  msg.style.display='block';
  msg.style.background='#2a2a20';
  msg.style.color='#fff';
  msg.style.border='1px solid #444';

  var payload={password:password};
  if(totp) payload.totp=totp;
  if(pendingToken) payload.pending=pendingToken;

  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),credentials:'include'})
    .then(function(r){return r.json().then(function(d){return {status:r.status,data:d};});})
    .then(function(res){
      if(res.data.ok){
        msg.className='msg ok';
        msg.textContent='Giriş başarılı, yönlendiriliyor...';
        setTimeout(function(){location.href='/admin';},400);
        return;
      }
      if(res.data.needs2fa){
        twoFactorRequired=true;
        pendingToken=res.data.pending||'';
        document.getElementById('totp-wrap').style.display='block';
        document.getElementById('totp').focus();
        msg.className='msg';
        msg.style.display='block';
        msg.style.background='#2a2a20';
        msg.style.color='#fbbf24';
        msg.style.border='1px solid #854d0e';
        msg.textContent=res.data.message||(res.data.twoFactorMethod==='email'?'Kod e-postanıza gönderildi.':'Doğrulama kodu gerekli.');
        btn.disabled=false;
        return;
      }
      msg.className='msg err';
      msg.textContent=res.data.error||'Giriş başarısız';
      if(res.data.retryAfter) msg.textContent+=' ('+res.data.retryAfter+' sn bekleyin)';
      btn.disabled=false;
    })
    .catch(function(){
      msg.className='msg err';
      msg.textContent='Bağlantı hatası';
      btn.disabled=false;
    });
});
</script>
</body>
</html>
