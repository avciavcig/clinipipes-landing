<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CliniPipes Admin</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f4f4f2;color:#111}header{background:#0E0E0C;color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem}.logo{color:#1D9E75;font-weight:700;font-size:1.2rem}main{max-width:860px;margin:2rem auto;padding:0 1rem}.card{background:#fff;border-radius:10px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}h2{font-size:1rem;margin-bottom:1rem;color:#333;border-bottom:1px solid #eee;padding-bottom:.5rem}label{display:block;font-size:.82rem;color:#666;margin-bottom:.25rem;margin-top:.75rem}input[type=text],input[type=number]{width:100%;padding:.5rem .75rem;border:1px solid #ddd;border-radius:6px;font-size:.9rem}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}.shot-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.slot{border:2px dashed #ddd;border-radius:8px;padding:1rem}.slot img{width:100%;height:130px;object-fit:cover;border-radius:4px;margin-bottom:.5rem}.slot .ph{height:130px;background:#f8f8f6;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:.8rem;margin-bottom:.5rem}#saveBtn{background:#1D9E75;color:#fff;border:none;padding:.75rem 2rem;border-radius:8px;font-size:1rem;cursor:pointer;width:100%}#saveBtn:hover{background:#0f7a5a}#status{margin-top:1rem;padding:.75rem;border-radius:6px;text-align:center;display:none}</style></head><body><header><span class="logo">&#9881; CliniPipes Admin</span><span style="color:#888;font-size:.85rem;margin-left:auto">Kaydet → GitHub commit → Railway ~2dk</span></header><main><div class="card"><h2>&#128176; Fiyatlar</h2><div class="row3"><div><label>Başlangıç / ay (€)</label><input type="number" id="p-sm"><label>Başlangıç / yıl (€)</label><input type="number" id="p-sy"></div><div><label>Pro / ay (€)</label><input type="number" id="p-pm"><label>Pro / yıl (€)</label><input type="number" id="p-py"></div><div><label>Kurulum (€)</label><input type="number" id="p-setup"><label>Paket indirimi (€)</label><input type="number" id="p-bundle"></div></div></div><div class="card"><h2>&#128247; Galeri Görselleri <small style="font-weight:400;color:#999">(PNG/JPG yükle → Kaydet)</small></h2><div class="shot-grid" id="grid"></div></div><button id="saveBtn" onclick="doSave()">&#128190; Kaydet &amp; Yayınla</button><div id="status"></div></main><script>var DEFS=[{alt:"Panel Girişi",cap_tr:"Güvenli panel girişi",cap_en:"Secure panel login"},{alt:"Kurulum Paneli",cap_tr:"Klinik kurulum paneli",cap_en:"Clinic setup panel"},{alt:"Form Oluşturucu",cap_tr:"Sürükle-bırak form oluşturucu",cap_en:"Drag-and-drop form builder"},{alt:"Ön Değerlendirme",cap_tr:"Hasta ön değerlendirme formu",cap_en:"Patient pre-assessment form"}];var cur={prices:{sm:45,sy:450,pm:89,py:890,setup:199,bundle:20},gallery:[]};var KEY=new URLSearchParams(location.search).get("key");function build(){var g=document.getElementById("grid");g.innerHTML="";DEFS.forEach(function(d,i){var c=cur.gallery[i]||null;var el=document.createElement("div");el.className="slot";el.innerHTML=(c?"<img id=\"gi"+i+"\" src=\""+c.src+"\">":"<div class=\"ph\" id=\"ph"+i+"\">"+d.cap_tr+"</div><img id=\"gi"+i+"\" style=\"display:none\">" )+"<input type=\"file\" accept=\"image/*\" onchange=\"pick(this,"+i+")\"><input type=\"text\" id=\"ct"+i+"\" value=\""+(c?c.cap_tr:d.cap_tr)+"\" placeholder=\"TR başlık\" style=\"margin-top:.3rem\"><input type=\"text\" id=\"ce"+i+"\" value=\""+(c?c.cap_en:d.cap_en)+"\" placeholder=\"EN caption\" style=\"margin-top:.25rem\">";g.appendChild(el);});}function pick(inp,i){var f=inp.files[0];if(!f)return;new FileReader().onload=function(e){var src=e.target.result;var im=document.getElementById("gi"+i);if(im){im.src=src;im.style.display="block";}var ph=document.getElementById("ph"+i);if(ph)ph.style.display="none";cur.gallery[i]={src:src,alt:DEFS[i].alt,cap_tr:document.getElementById("ct"+i).value,cap_en:document.getElementById("ce"+i).value};};(new FileReader()).onload=function(e){var src=e.target.result;var im=document.getElementById("gi"+i);if(im){im.src=src;im.style.display="block";}var ph=document.getElementById("ph"+i);if(ph)ph.style.display="none";cur.gallery[i]={src:src,alt:DEFS[i].alt,cap_tr:document.getElementById("ct"+i).value,cap_en:document.getElementById("ce"+i).value};}; var r=new FileReader();r.onload=function(e){var src=e.target.result;var im=document.getElementById("gi"+i);if(im){im.src=src;im.style.display="block";}var ph=document.getElementById("ph"+i);if(ph)ph.style.display="none";cur.gallery[i]={src:src,alt:DEFS[i].alt,cap_tr:document.getElementById("ct"+i).value,cap_en:document.getElementById("ce"+i).value};};r.readAsDataURL(f);}function doSave(){DEFS.forEach(function(d,i){if(cur.gallery[i]){cur.gallery[i].cap_tr=document.getElementById("ct"+i).value;cur.gallery[i].cap_en=document.getElementById("ce"+i).value;}});var data={prices:{sm:+document.getElementById("p-sm").value,sy:+document.getElementById("p-sy").value,pm:+document.getElementById("p-pm").value,py:+document.getElementById("p-py").value,setup:+document.getElementById("p-setup").value,bundle:+document.getElementById("p-bundle").value},gallery:cur.gallery.filter(Boolean)};var st=document.getElementById("status");st.style.display="block";st.style.background="#fffbe0";st.textContent="Kaydediliyor...";fetch("/api/save?key="+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(r){return r.json();}).then(function(r){if(r.ok){st.style.background="#e0fce8";st.textContent=r.github?"✓ Kaydedildi — GitHub commit gönderildi. ~2dk içinde yayında.":"✓ Yerel kaydedildi (GITHUB_TOKEN yoksa deploy sonrası sıfırlanır).";}else{st.style.background="#fee";st.textContent="Hata.";}}).catch(function(e){st.style.background="#fee";st.textContent="Hata: "+e.message;});}fetch("/content.json?t="+Date.now()).then(function(r){return r.json();}).then(function(c){if(c.prices){cur.prices=c.prices;["sm","sy","pm","py","setup","bundle"].forEach(function(k){var el=document.getElementById("p-"+k);if(el)el.value=c.prices[k];});}if(c.gallery)cur.gallery=c.gallery;build();}).catch(function(){build();});</script></body></html>
